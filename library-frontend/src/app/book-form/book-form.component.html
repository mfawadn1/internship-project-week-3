<h2>Add New Book</h2>
<form [formGroup]="bookForm" (ngSubmit)="onSubmit()">
  <div>
    <label for="title">Title:</label>
    <input id="title" type="text" formControlName="title">
    <div *ngIf="bookForm.get('title')?.invalid && bookForm.get('title')?.touched" class="error">
      Title is required.
    </div>
  </div>

  <div>
    <label for="author">Author:</label>
    <input id="author" type="text" formControlName="author">
    <div *ngIf="bookForm.get('author')?.invalid && bookForm.get('author')?.touched" class="error">
      Author is required.
    </div>
  </div>

  <div>
    <label for="category">Category:</label>
    <input id="category" type="text" formControlName="category">
    <div *ngIf="bookForm.get('category')?.invalid && bookForm.get('category')?.touched" class="error">
      Category is required.
    </div>
  </div>

  <button type="submit" [disabled]="bookForm.invalid">Save Book</button>
</form>
